server {
    listen 80;
    server_name your_domain.com; # Replace with your actual domain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your_domain.com; # Replace with your actual domain

    ssl_certificate /etc/nginx/ssl/live/your_domain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/your_domain.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf; # This file is generated by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # This file is also generated by Certbot

    location / {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3001:3001" # Expose the backend port internally for Nginx to connect
    environment:
      NODE_ENV: production
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443" # For HTTPS later
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot/:ro # For Certbot validation
      - ./certbot/conf:/etc/nginx/ssl/:ro # For SSL certificates
    depends_on:
      - backend
    restart: always


services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:3001" # Bind to localhost only, nginx on host network will reach it here
    environment:
      NODE_ENV: production
    restart: always
    networks:
      - ruben-cv

  nginx:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
    network_mode: host # Binds directly to host network, NPM can reach it at 127.0.0.1:3002
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: always

networks:
  ruben-cv:
    name: ruben-cv

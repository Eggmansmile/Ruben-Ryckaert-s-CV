
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3001:3001" # Expose the backend port internally for Nginx to connect
    environment:
      NODE_ENV: production
    restart: always

  nginx:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "82:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot/:ro # For Certbot validation
      - ./certbot/conf:/etc/nginx/ssl/ # For SSL certificates
    command: >
      /bin/sh -c "
      apk add --no-cache openssl;
      if [ ! -f /etc/nginx/ssl/nginx.crt ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/nginx.key -out /etc/nginx/ssl/nginx.crt -subj '/CN=localhost';
      fi;
      nginx -g 'daemon off;'"
    depends_on:
      - backend
    restart: always
